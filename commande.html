<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Commander — Dar El Halwa</title>
</head>
<body>
    <header>
        <h1>Dar El Halwa</h1>
        <nav>
            <ul>
                <li><a href="index.html">Accueil</a></li>
                <li><a href="carte.html">Carte</a></li>
                <li><a href="commande.html">Commander</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h2>Commander un gâteau personnalisé</h2>
        
        <form action="traitement.php" method="post">
            
           
            <fieldset>
                <legend>Vos coordonnées</legend>
                
                <p>
                    <label for="nom">Nom :</label>
                    <input type="text" id="nom" name="nom" minlength="2" required>
                </p>
                
                <p>
                    <label for="prenom">Prénom :</label>
                    <input type="text" id="prenom" name="prenom" minlength="2" required>
                </p>
                
                <p>
                    <label for="email">Adresse électronique :</label>
                    <input type="email" id="email" name="email" placeholder="vous@exemple.tn" required>
                </p>
                
                <p>
                    <label for="telephone">Téléphone :</label>
                    <input type="tel" id="telephone" name="telephone" pattern="\+216[0-9]{8}" title="+216 suivi de 8 chiffres" placeholder="+21622550211" required>
                </p>
                
                <p>
                    <label for="code-postal">Code postal :</label>
                    <input type="text" id="code-postal" name="code_postal" pattern="[0-9]{4}" maxlength="4" title="4 chiffres" required>
                </p>
                
                <p>
                    <label for="adresse">Adresse de livraison :</label>
                    <textarea id="adresse" name="adresse" rows="3" cols="40" required></textarea>
                </p>
                
                <p>
                    <label for="gouvernorat">Gouvernorat :</label>
                    <select id="gouvernorat" name="gouvernorat" required>
                        <option value="sfax" selected>Sfax</option>
                        <option value="tunis">Tunis</option>
                        <option value="sousse">Sousse</option>
                        <option value="gabes">Gabès</option>
                        <option value="autre">Autre</option>
                    </select>
                </p>
            </fieldset>

            
            <fieldset>
                <legend>Votre gâteau</legend>
                
                
                <fieldset>
                    <legend>Occasion</legend>
                    <p>
                        <input type="radio" id="occ-anniv" name="occasion" value="anniversaire" required>
                        <label for="occ-anniv">Anniversaire</label>
                    </p>
                    <p>
                        <input type="radio" id="occ-mariage" name="occasion" value="mariage">
                        <label for="occ-mariage">Mariage</label>
                    </p>
                    <p>
                        <input type="radio" id="occ-fiancailles" name="occasion" value="fiancailles">
                        <label for="occ-fiancailles">Fiançailles</label>
                    </p>
                    <p>
                        <input type="radio" id="occ-autre" name="occasion" value="autre">
                        <label for="occ-autre">Autre</label>
                    </p>
                </fieldset>

                <p>
                    <label for="date-retrait">Date de retrait :</label>
                    <input type="date" id="date-retrait" name="date_retrait" min="2026-09-01" required>
                </p>

                <p>
                    <label for="nb-parts">Nombre de parts :</label>
                    <input type="number" id="nb-parts" name="nb_parts" min="6" max="100" step="2" value="12" required>
                </p>

                <fieldset>
                    <legend>Parfums souhaités</legend>
                    <p>
                        <input type="checkbox" id="parfum-choc" name="parfums[]" value="chocolat" checked>
                        <label for="parfum-choc">Chocolat</label>
                    </p>
                    <p>
                        <input type="checkbox" id="parfum-vanille" name="parfums[]" value="vanille">
                        <label for="parfum-vanille">Vanille</label>
                    </p>
                    <p>
                        <input type="checkbox" id="parfum-pistache" name="parfums[]" value="pistache">
                        <label for="parfum-pistache">Pistache</label>
                    </p>
                    <p>
                        <input type="checkbox" id="parfum-fruits" name="parfums[]" value="fruits_rouges">
                        <label for="parfum-fruits">Fruits rouges</label>
                    </p>
                </fieldset>

                <p>
                    <label for="sucre">Niveau de sucre (0 à 10) :</label>
                    <input type="range" id="sucre" name="sucre" min="0" max="10" step="1" value="5">
                </p>

                <p>
                    <label for="couleur">Couleur du glaçage :</label>
                    <input type="color" id="couleur" name="couleur" value="#c8912a">
                </p>

                <p>
                    <label for="message">Message sur le gâteau (max 30 car.) :</label>
                    <input type="text" id="message" name="message" maxlength="30">
                </p>

                <p>
                    <label for="photo">Photo de modèle :</label>
                    <input type="file" id="photo" name="photo" accept="image/*">
                </p>

                <p>
                    <label for="decors">Langages de décoration :</label>
                    <select multiple size="4" id="decors" name="decors[]">
                        <option value="fleurs">Fleurs en pâte à sucre</option>
                        <option value="fruits">Fruits frais</option>
                        <option value="perles">Perles en sucre</option>
                        <option value="chocolat_deco">Copeaux de chocolat</option>
                    </select>
                </p>

                <p>
                    <label for="precisions">Précisions :</label>
                    <textarea id="precisions" name="precisions" rows="4" cols="40" maxlength="200"></textarea>
                </p>
            </fieldset>

            
            <p>
                <button type="submit">Envoyer ma commande</button>
                <button type="reset">Tout effacer</button>
            </p>

        </form>
    </main>

    <footer>
        <p>&copy; 2026 - Dar El Halwa</p>
    </footer>
</body>
</html>
